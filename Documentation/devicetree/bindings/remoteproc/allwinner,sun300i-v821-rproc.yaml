%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/allwinner,sun300i-v821-rproc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner V821 E907 Remoteproc

maintainers:
  - ChainsX <chainsx@outlook.com>

properties:
  compatible:
    const: allwinner,sun300i-v821-rproc

  reg:
    maxItems: 1

  allwinner,ccu:
    description: Phandle to the V821 CCU, used to access E907 reset controls.
    $ref: /schemas/types.yaml#/definitions/phandle

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string

  memory-region: true

  clocks:
    minItems: 3
    maxItems: 3

  clock-names:
    items:
      - const: core
      - const: gate
      - const: ts

  resets:
    minItems: 2
    maxItems: 2

  reset-names:
    items:
      - const: rv
      - const: apb

  mboxes:
    maxItems: 1

  mbox-names:
    items:
      - const: tx

required:
  - compatible
  - reg
  - allwinner,ccu
  - firmware-name
  - memory-region
  - clocks
  - clock-names
  - resets
  - reset-names
  - mboxes
  - mbox-names

additionalProperties: false

examples:
  - |
    remoteproc@43030000 {
        compatible = "allwinner,sun300i-v821-rproc";
        reg = <0 0x43030000 0 0x1000>;
        allwinner,ccu = <&ccu>;
        firmware-name = "amp_rv0.bin";
        memory-region = <&e907_mem>;
        clocks = <&e907_core>, <&ccu 14>, <&ccu 13>;
        clock-names = "core", "gate", "ts";
        resets = <&ccu 10>, <&ccu 9>;
        reset-names = "rv", "apb";
        mboxes = <&msgbox 0>;
        mbox-names = "tx";
    };

%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/allwinner,sun300i-v821-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner V821 Pin Controllers

maintainers:
  - ChainsX <chainsx@outlook.com>

properties:
  compatible:
    enum:
      - allwinner,sun300i-v821-pinctrl
      - allwinner,sun300i-v821-r-pinctrl

  reg:
    maxItems: 1

  interrupts: true

  clocks: true

  clock-names: true

  gpio-controller: true

  '#gpio-cells':
    const: 3

  interrupt-controller: true

  '#interrupt-cells':
    const: 3

patternProperties:
  '-pins$':
    type: object
    additionalProperties: false

    properties:
      pins: true
      function: true
      bias-disable: true
      bias-pull-up: true
      bias-pull-down: true
      drive-strength:
        enum: [ 10, 20, 30, 40 ]

    required:
      - pins
      - function

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - gpio-controller
  - '#gpio-cells'
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    pio: pinctrl@42000000 {
        compatible = "allwinner,sun300i-v821-pinctrl";
        reg = <0 0x42000000 0 0x500>;
        interrupts = <0 68 4>, <0 72 4>, <0 74 4>;
        clocks = <&pll_peri_192m>, <&dcxo>, <&losc>;
        clock-names = "apb", "hosc", "losc";
        gpio-controller;
        #gpio-cells = <3>;
        interrupt-controller;
        #interrupt-cells = <3>;
    };

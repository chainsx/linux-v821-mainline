%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/allwinner,sun300i-v821-msgbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner V821 Message Box

maintainers:
  - ChainsX <chainsx@outlook.com>

properties:
  compatible:
    const: allwinner,sun300i-v821-msgbox

  reg:
    items:
      - description: E907 message controller
      - description: A27 message controller

  reg-names:
    items:
      - const: remote
      - const: local

  interrupts:
    items:
      - description: E907 message controller interrupt
      - description: A27 message controller interrupt

  interrupt-names:
    items:
      - const: remote
      - const: local

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  '#mbox-cells':
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - resets
  - '#mbox-cells'

additionalProperties: false

examples:
  - |
    mailbox@43033000 {
        compatible = "allwinner,sun300i-v821-msgbox";
        reg = <0 0x43033000 0 0x1000>,
              <0 0x49102000 0 0x1000>;
        reg-names = "remote", "local";
        interrupts = <0 130 4>, <0 123 4>;
        interrupt-names = "remote", "local";
        clocks = <&ccu 12>;
        resets = <&ccu 8>;
        #mbox-cells = <1>;
    };
